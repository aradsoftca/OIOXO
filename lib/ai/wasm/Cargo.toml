[package]
name = "brain-core"
version = "0.1.0"
edition = "2021"
description = "Xonvert AI brain core — pure decision logic compiled to WASM so the IP ships as bytecode, not readable JS."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
