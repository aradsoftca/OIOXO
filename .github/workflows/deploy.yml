name: Build (obfuscated) & Deploy newxonvert

# Fast deploys WITHOUT giving up full obfuscation.
#
# Why fast: the heavy work — full OBFUSCATE=1 `next build` + worker encryption —
# runs HERE on a fast Linux runner, with Next's build cache restored across runs
# so obfuscation only re-chews the files that changed. The Iceland CPU box never
# compiles; it just receives the prebuilt artifact and does the same proven
# env/prisma/swap/PM2/Caddy/smoke steps via deploy.py --from-artifact.
# Result: ~90 min cold server build → a few minutes, obfuscation fully intact.
#
# deploy.py stays the SINGLE SOURCE OF TRUTH for shipping (no parallel recipe to
# drift). This workflow only moves the build off the server.

on:
  # This repo's app IS the root (no newxonvert/ subdir). Deploy from the branch
  # that carries the shippable tree. Adjust `branches` to your release branch.
  push:
    branches: [feat/flagship-gap-fixes, master]
  workflow_dispatch: {}

concurrency:
  group: deploy-newxonvert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tool_key: ${{ steps.mintkey.outputs.tool_key }}
    # The app does live DB reads during static generation, so `next build` needs
    # a reachable Postgres (the server build works because it builds next to its
    # DB at 127.0.0.1:5432). Spin up a throwaway one with the SAME creds the
    # DATABASE_URL expects; we `prisma db push` the schema into it before build.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newxonvert
          POSTGRES_PASSWORD: nx_pw_change_me
          POSTGRES_DB: newxonvert
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U newxonvert"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Incremental obfuscated builds: restore Next's compiler cache so only
      # changed files are recompiled/obfuscated.
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      - name: Install deps
        run: npm ci --include=dev --no-audit --no-fund

      # Mint a fresh TOOL_WASM_KEY for this build (same contract as deploy.py's
      # mint_tool_key): prebuild encrypts the engine workers with it; the ship
      # step writes the SAME key to the remote .env so the live site unlocks them.
      - name: Mint tool-worker key
        id: mintkey
        run: |
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "tool_key=$KEY" >> "$GITHUB_OUTPUT"

      # The build itself needs the prod env (POW_SECRET, NEXTAUTH_SECRET, DB URL…)
      # — some API routes hard-fail at build/page-data collection without them.
      # The server build gets these because deploy.py writes .env before building;
      # mirror that here. Next auto-loads .env at build time.
      - name: Write build .env
        run: |
          printf '%s\n' "${{ secrets.NEWXONVERT_DEPLOY_ENV }}" > .env
          printf 'TOOL_WASM_KEY=%s\n' "${{ steps.mintkey.outputs.tool_key }}" >> .env
          # DATABASE_URL is composed server-side by deploy.py's write_remote_env
          # (points at the server's local Postgres). The build only needs it
          # DEFINED so Prisma's client doesn't throw at page-data collection — no
          # live DB is contacted during `next build`. Use the same value
          # deploy.py writes; the ship step's prisma runs against the real server DB.
          # Mirror the rest of deploy.py write_remote_env() `base` defaults the
          # build may read (so we don't discover them one slow build at a time).
          grep -q '^DATABASE_URL=' .env || \
            printf 'DATABASE_URL=postgresql://newxonvert:nx_pw_change_me@127.0.0.1:5432/newxonvert?schema=public\n' >> .env
          grep -q '^NEXTAUTH_URL=' .env || printf 'NEXTAUTH_URL=https://xonvert.com\n' >> .env
          grep -q '^NEXT_BASE_PATH=' .env || printf 'NEXT_BASE_PATH=\n' >> .env
          grep -q '^NEXT_PUBLIC_BASE_PATH=' .env || printf 'NEXT_PUBLIC_BASE_PATH=\n' >> .env

      # Push the schema into the throwaway Postgres so the build's
      # static-generation DB reads hit real (empty) tables instead of erroring.
      - name: Prisma push (build DB)
        run: npx prisma db push --skip-generate && npx prisma generate

      - name: Build (full obfuscation)
        env:
          OBFUSCATE: '1'
          NEXT_BASE_PATH: ''
          TOOL_WASM_KEY: ${{ steps.mintkey.outputs.tool_key }}
        # The build must GENUINELY succeed. A FAILED `next build` still writes
        # BUILD_ID + routes-manifest but OMITS prerender-manifest.json — and
        # `next start` crash-loops without it (this shipped a broken .next once
        # and 502'd prod). So: require exit 0 AND a complete .next including
        # prerender-manifest.json. Prerender throws (DB/`document`) must be fixed
        # at the source, never tolerated.
        run: |
          npm run build
          for f in BUILD_ID required-server-files.json routes-manifest.json prerender-manifest.json; do
            if [ ! -f ".next/$f" ]; then echo "MISSING .next/$f — build is not bootable"; exit 1; fi
          done
          echo "Build complete: exit 0 + all required .next manifests present."

      # Never let the build .env leak into the artifact tar.
      - name: Scrub build .env
        if: always()
        run: rm -f .env

      # The server needs: the built .next, freshly-encrypted public assets
      # (incl. protected/*.enc workers), and prisma schema. node_modules stays
      # persistent on the server (deploy.py --from-artifact runs npm ci there
      # only when the lockfile changed).
      # Carry the build's TOOL_WASM_KEY inside the artifact. (A ::add-mask::'d
      # value becomes "" when passed via needs.*.outputs across jobs, so we
      # can't hand it over that way — ship it in the tarball instead.)
      - name: Package artifact
        run: |
          printf '%s' "${{ steps.mintkey.outputs.tool_key }}" > .tool_wasm_key
          tar -czf /tmp/nx-build.tgz .next public prisma .tool_wasm_key
          rm -f .tool_wasm_key

      - uses: actions/upload-artifact@v4
        with:
          name: newxonvert-build
          path: /tmp/nx-build.tgz
          retention-days: 3

  ship:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production       # repo setting can require manual approval here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install paramiko

      - uses: actions/download-artifact@v4
        with: { name: newxonvert-build, path: /tmp/art }

      # deploy.py reads creds + the deploy .env from these. We pass the build's
      # minted key and the artifact path; deploy.py does env/prisma/swap/PM2/
      # Caddy/smoke exactly as it does for a normal deploy.
      - name: Deploy (ship prebuilt artifact)
        env:
          ICELAND_HOST: ${{ secrets.ICELAND_HOST }}
          ICELAND_USER: ${{ secrets.ICELAND_USER }}
          ICELAND_PASSWORD: ${{ secrets.ICELAND_PASSWORD }}
          NEWXONVERT_DEPLOY_ENV: ${{ secrets.NEWXONVERT_DEPLOY_ENV }}
        run: |
          # deploy.py writes .env.deploy.local from the secret, then ships the
          # prebuilt artifact. The TOOL_WASM_KEY the workers were encrypted with
          # travels INSIDE the tarball (.tool_wasm_key) — read it from there
          # (masked job-outputs arrive empty across jobs, so we don't use that).
          printf '%s\n' "$NEWXONVERT_DEPLOY_ENV" > .env.deploy.local
          KEY=$(tar -xzOf /tmp/art/nx-build.tgz .tool_wasm_key)
          echo "::add-mask::$KEY"
          export TOOL_WASM_KEY="$KEY"
          python scripts/deploy.py --from-artifact /tmp/art/nx-build.tgz
